<!DOCTYPE html>
  <html>
  <head>
      <title>Applepalooza</title>
  </head>
  <body>
<h1>Applepalooza</h1>
      <p>Written in Processing by Rachel Aronov</p>
<script src="processing-1.4.8.js"></script>
 <script type="text/processing" data-processing-target="processing-canvas">
 
 
 
 //APPLE PALOOZA GAME CODE
int x=240;
int y=110;
int a=142;
int b=45;
int c=275;
int d=68;
int e=200;
int gameState = 0;
int yExists=1;
int xExists=1;
int aExists=1;
int bExists=1;
int cExists=1;
int dExists=1;
int eExists=1;
// declaration of all variables: for the apples and their existence + gamestates

void setup () {
  size(1350, 700);
}
void mouseClicked() {

  if (gameState==0) { 
    gameState=1;
  } 
  //if mouse is clicked on starting screen, game begins

  if (gameState==2) {
    x=240;
    y=110;
    a=142;
    b=45;
    c=275;
    d=68;
    e=200;
    gameState = 1;
    yExists=1;
    xExists=1;
    aExists=1;
    bExists=1;
    cExists=1;
    dExists=1;
    eExists=1;    
    // if mouse is clicked on completion screen, 
    //the game restarts (can be replayed) and variables are redeclared into original state and into existence.
  }
}
void draw () {
  if (gameState==2) {
    background(#F51E69);
    textSize(80);
    fill(#FEFFFC);
    text("You collected all the apples! ", 700, 200);
    textAlign(CENTER);
    textSize(70);
    text("Click to the mouse to play again.", 700, 425);
    textAlign(CENTER);
    text("Hooray! :)", 700, 325);
    textAlign(CENTER);
  }
  // completeion of game screen (gamestate=2)

  if (gameState==0) {
    fill(#EA5AF2);
    background(#94E7FC);
    textSize(90);
    text("APPLE PALOOZA", 300, 200);
    textSize(40);
    text("Instructions: Catch all the falling apples until there are none left.", 70, 300);
    text("Use your mouse to move the apple basket. Good luck :)", 100, 400);
    text("Click to start game", 450, 600);
    // starting screen (gamestate= 0)
  } 
  if (gameState==1) { // when the gamestate is 1 and the game is being played, the following is coded
    background(#94E7FC);
    fill(#746116);
    noStroke();
    rect(645, 200, 100, 700);// tree trunk

    fill(#0BDB2B);
    noStroke();
    rect(0, 0, 1350, 200);
    ellipse(50, 220, 200, 200);
    ellipse(300, 220, 400, 400);
    ellipse(580, 220, 250, 250);
    ellipse(800, 240, 375, 275);
    ellipse(1100, 220, 300, 300);
    ellipse(1300, 220, 200, 200);// tree bush

    smooth();
    fill(#FA1286);
    ellipse(90, 610, 40, 40);
    ellipse(90, 660, 40, 40);
    ellipse(60, 635, 40, 40);
    ellipse(120, 635, 40, 40);
    fill(250, 250, 250);
    ellipse(90, 634, 30, 30);

    fill(#DE2FC7);
    ellipse(220, 610, 40, 40);
    ellipse(220, 660, 40, 40);
    ellipse(200, 635, 40, 40);
    ellipse(240, 635, 40, 40);
    fill(250, 250, 250);
    ellipse(220, 634, 30, 30);

    smooth();
    fill(#FA1286);
    ellipse(370, 610, 40, 40);
    ellipse(370, 660, 40, 40);
    ellipse(340, 635, 40, 40);
    ellipse(400, 635, 40, 40);
    fill(250, 250, 250);
    ellipse(370, 634, 30, 30);

    fill(#DE2FC7);
    ellipse(500, 610, 40, 40);
    ellipse(500, 660, 40, 40);
    ellipse(480, 635, 40, 40);
    ellipse(520, 635, 40, 40);
    fill(250, 250, 250);
    ellipse(500, 634, 30, 30);
    smooth();

    fill(#FA1286);
    ellipse(800, 610, 40, 40);
    ellipse(800, 660, 40, 40);
    ellipse(770, 635, 40, 40);
    ellipse(830, 635, 40, 40);
    fill(250, 250, 250);
    ellipse(800, 634, 30, 30);

    fill(#DE2FC7);
    ellipse(920, 610, 40, 40);
    ellipse(920, 660, 40, 40);
    ellipse(900, 635, 40, 40);
    ellipse(940, 635, 40, 40);
    fill(250, 250, 250);
    ellipse(920, 634, 30, 30);
    smooth();


    fill(#FA1286);
    ellipse(1040, 610, 40, 40);
    ellipse(1040, 660, 40, 40);
    ellipse(1010, 635, 40, 40);
    ellipse(1070, 635, 40, 40);
    fill(250, 250, 250);
    ellipse(1040, 634, 30, 30);

    fill(#DE2FC7);
    ellipse(1160, 610, 40, 40);
    ellipse(1160, 660, 40, 40);
    ellipse(1140, 635, 40, 40);
    ellipse(1180, 635, 40, 40);
    fill(250, 250, 250);
    ellipse(1160, 634, 30, 30);
    smooth();

    //flowers 


    if (x<800&&xExists==1) {
      fill(#D60B12);
      noStroke();
      ellipse(90, x, 80, 80);
      x=x+2;//apple increases at this particular speed
    }
    if (x>680) {
      x=0;
    } // if the apple is greater than 680, the variable resets back to 0 (apple is starting from top)

    if (y<800&&yExists==1) {
      fill(#D60B12);
      noStroke();
      ellipse(300, y, 80, 80);
      y=y+2;//apple increases at this particular speed
    }
    if (y>680) {
      y=0;
    } // if the apple is greater than 680, the variable resets back to 0 (apple is starting from top)

    if (a<800&&aExists==1) {
      fill(#D60B12);
      noStroke();
      ellipse(170, a, 80, 80);
      a=a+4;//apple increases at this particular speed
    }
    if (a>680) {
      a=0;
    } // if the apple is greater than 680, the variable resets back to 0 (apple is starting from top)

    if (b<800&&bExists==1) {
      fill(#D60B12);
      noStroke();
      ellipse(700, b, 80, 80);
      b=b+3;//apple increases at this particular speed
    }
    if (b>680) {
      b=0;
    } // if the apple is greater than 680, the variable resets back to 0 (apple is starting from top)

    if (c<800&&cExists==1) {
      fill(#D60B12);
      noStroke();
      ellipse(800, c, 80, 80);
      c=c+2;//apple increases at this particular speed
    }
    if (b>680) {
      c=0;
    } // if the apple is greater than 680, the variable resets back to 0 (apple is starting from top)

    if (d<800&&dExists==1) {
      fill(#D60B12);
      noStroke();
      ellipse(1000, d, 80, 80);
      d=d+2; //apple increases at this particular speed
    }
    if (d>680) {
      d=0;
    } // if the apple is greater than 680, the variable resets back to 0 (apple is starting from top)

    if (e<800&&eExists==1) {
      fill(#D60B12);
      noStroke();
      ellipse(1200, e, 80, 80);
      e=e+2; //apple increases at this particular speed
    }
    if (e>680) {
      e=0;
    } // if the apple is greater than 680, the variable resets back to 0 (apple is starting from top)

    // moving (7) apples with separate variables and if statements when they exist, 
    //all moved at certain speeds


    fill(#5E0BD6);
    rect(mouseX, 550, 250, 150, 30);
    fill(#FA28D7);
    textSize(28);
    textAlign(LEFT);
    text("APPLE BASKET", mouseX+30, 625); 
    // apple basket that is controlled with mouseX to move horizontally
    // has 'apple basket' printed on it

    if (yExists==0&&xExists==0&&aExists==0&&bExists==0&&cExists==0&&dExists==0&&eExists==0) {
      gameState=2;
      // if the apples don't exist/caught, go to winner/completion screen
    }
  }
  if (mouseX<300&&mouseX+250>300&&y>620) {
    yExists=0;
  }
  if (mouseX<90&&mouseX+250>90&&x>620) {
    xExists=0;
  }
  if (mouseX<170&&mouseX+250>170&&a>620) {
    aExists=0;
  }
  if (mouseX<700&&mouseX+250>700&&b>620) {
    bExists=0;
  }
  if (mouseX<800&&mouseX+250>800&&c>620) {
    cExists=0;
  }
  if (mouseX<1000&&mouseX+250>1000&&d>620) {
    dExists=0;
  }
  if (mouseX<1200&&mouseX+250>1200&&e>620) {
    eExists=0;
  }
  //if the apples touch the basket (and at a certain point of the height of the screen) 
  //they are "collected"-they disappear because they are collected
  // (if they don't touch the parameters, the apples will continue falling until 
  //they are caught)
}

 
 
 
</script>
 <canvas id="processing-canvas"> </canvas>
</body>
</html>
